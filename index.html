<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f2937">
  <title>fruit-measure</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 첫 화면 -->
  <main id="screen-home" class="home">
    <header class="home-header">
      <h1>fruit-measure</h1>
      <p class="subtitle">신용카드와 함께 찍어 과일 크기를 측정합니다</p>
    </header>

    <div class="actions">
      <button id="btn-open" class="btn btn-primary" type="button">사진 불러오기</button>
      <button id="btn-records" class="btn btn-secondary" type="button">기록 보기</button>
    </div>

    <p id="home-message" class="guide">과일과 신용카드를 테이블 위에 나란히 놓고 위에서 찍은 사진을 불러오세요.</p>

    <input id="input-photo" type="file" accept="image/*" hidden>
  </main>

  <!-- 사진 화면 -->
  <section id="screen-photo" class="photo" hidden>
    <div class="photo-bar">
      <button id="btn-back" class="btn-bar" type="button">← 처음으로</button>
      <span class="photo-hint">휠로 확대, 드래그로 이동, 클릭으로 점 찍기</span>
    </div>
    <canvas id="photo-canvas" class="photo-canvas"></canvas>
    <div class="photo-panel">
      <p id="photo-status" class="photo-status"></p>
      <div class="photo-actions">
        <button id="btn-save" class="btn-save" type="button" disabled>기록 저장</button>
        <button id="btn-reset-fruit" class="btn-bar" type="button">과일 다시 측정</button>
        <button id="btn-reset-card" class="btn-bar" type="button">기준 다시 지정</button>
      </div>
    </div>
  </section>

  <!-- 기록 화면 -->
  <section id="screen-records" class="records" hidden>
    <div class="records-bar">
      <button id="btn-records-back" class="btn-bar" type="button">← 처음으로</button>
      <h2>측정 기록</h2>
    </div>
    <p id="records-empty" class="records-empty">아직 저장된 기록이 없습니다.</p>
    <table id="records-table" class="records-table" hidden>
      <thead>
        <tr><th>번호</th><th>크기(mm)</th><th>측정 시각</th><th></th></tr>
      </thead>
      <tbody id="records-body"></tbody>
    </table>
  </section>

  <script src="app.js"></script>
</body>
</html>
