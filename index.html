<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f2937">
  <title>fruit-measure</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 첫 화면 -->
  <main id="screen-home" class="home">
    <header class="home-header">
      <h1>fruit-measure</h1>
      <p class="subtitle">신용카드와 함께 찍어 과일 크기를 측정합니다</p>
    </header>

    <div class="actions">
      <button id="btn-open" class="btn btn-primary" type="button">사진 불러오기</button>
      <button id="btn-records" class="btn btn-secondary" type="button">기록 보기</button>
    </div>

    <p id="home-message" class="guide">과일과 신용카드를 테이블 위에 나란히 놓고 위에서 찍은 사진을 불러오세요.</p>

    <input id="input-photo" type="file" accept="image/*" hidden>
  </main>

  <!-- 사진 화면 -->
  <section id="screen-photo" class="photo" hidden>
    <div class="photo-bar">
      <button id="btn-back" class="btn-bar" type="button">← 처음으로</button>
      <span class="photo-hint">마우스 휠로 확대, 드래그로 이동</span>
    </div>
    <canvas id="photo-canvas" class="photo-canvas"></canvas>
  </section>

  <script src="app.js"></script>
</body>
</html>
